name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dev dependencies
        run: npm ci

      - name: Lint and metadata checks
        run: npm run check

      - name: Test
        run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public

      # A tag push now produces both the npm release and the GitHub release, so a
      # release never depends on someone remembering the second half. The workflow
      # token is enough (`contents: write`); no personal access token is stored.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --generate-notes
