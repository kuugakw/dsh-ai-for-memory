name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A wrong tag would publish one version under another release name (or
      # fail mid-publish); catch it before npm sees anything.
      - name: Tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${expected}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dev dependencies
        run: npm ci

      - name: Lint and metadata checks
        run: npm run check

      - name: Test
        run: npm test

      # Publish the exact bytes that were attested, not a second tarball built
      # by npm during publish. Provenance still comes from the OIDC token.
      - name: Pack the release tarball
        run: npm pack

      - name: Attest the release tarball (GitHub artifact provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dsh-ai-for-memory-*.tgz

      - name: Publish with provenance
        run: npm publish ./dsh-ai-for-memory-*.tgz --provenance --access public

      - name: Verify published provenance and commit
        run: node scripts/verify-release.mjs "$(node -p "require('./package.json').version")"

      - name: Verify the tarball attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dsh-ai-for-memory-*.tgz --repo "$GITHUB_REPOSITORY"

      # A tag push now produces both the npm release and the GitHub release, so a
      # release never depends on someone remembering the second half. The workflow
      # token is enough (`contents: write`); no personal access token is stored.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --generate-notes
