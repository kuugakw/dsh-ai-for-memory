name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint and metadata checks
        # The checked-in plugin index must agree with package.json, and the
        # README/docs version references must move with the manifest; a release
        # that forgets either would otherwise ship stale metadata.
        run: npm run check
      - name: Coverage gate
        # One job only: the thresholds are about the whole suite; running it once keeps the
        # matrix cheap.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run coverage
      - name: Type check
        # Opt-in `// @ts-check` files only (see docs/development.md); the rest of
        # lib is migrated onto the same gate incrementally.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run typecheck
      - name: noImplicitAny debt ratchet
        # `noImplicitAny` is still off globally; this fails when the implicit-any
        # error count grows. Lower the budget as modules are annotated.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run typecheck:strict
