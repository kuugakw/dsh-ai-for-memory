name: market

# Publishes the plugin index that DSH's experimental "Custom plugin indexes"
# feature can be pointed at (index.json + icons/ under market/).
#
# This runs after the `publish` workflow succeeds instead of starting next to it
# on the same tag: the old tag trigger raced npm publish, so the wait loop often
# expired and the job failed. workflow_run also means a failed publish never
# deploys an index that points at a version npm does not have.
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch:
  # Editing this workflow is a deploy intent: run it from the pushed commit so
  # a fix to the Pages pipeline takes effect without waiting for a release.
  push:
    branches: [main]
    paths: ['.github/workflows/market.yml']

permissions:
  contents: write
  pages: write
  id-token: write
  # Needed to remove a previous attempt's Pages artifact before re-uploading.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build on main so the rebuilt index can be committed back there.
          # The version assertion below ties it to the published release.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The publish workflow creates the release after npm publish. If that
      # step was skipped (e.g. a verification failure after a successful
      # publish), the index job can still finish the release instead of leaving
      # a published npm version with no GitHub Release.
      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes

      # The version endpoint can return 200 before the packument lists the
      # version; build-index reads the packument, so wait for that.
      - name: Wait until the npm packument lists this version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for _ in $(seq 1 60); do
            if VERSION="$version" node -e '
              fetch("https://registry.npmjs.org/dsh-ai-for-memory", {
                headers: { "user-agent": "dsh-ai-for-memory-market" },
              }).then((res) => res.json())
                .then((doc) => process.exit(doc.versions?.[process.env.VERSION] ? 0 : 1))
                .catch(() => process.exit(1));
            '; then
              echo "packument lists $version"
              exit 0
            fi
            sleep 20
          done
          echo "npm never listed dsh-ai-for-memory@$version" >&2
          exit 1

      - name: Build index
        run: node scripts/market/build-index.mjs

      - name: Assert the deployed index points at this version
        run: |
          VERSION=$(node -p "require('./package.json').version") node -e '
            const index = require("./market/index.json");
            const newest = index.plugins?.[0]?.versions?.[0]?.version;
            if (newest !== process.env.VERSION) {
              console.error(`index newest ${newest} != ${process.env.VERSION}`);
              process.exit(1);
            }
            console.log(`index newest ${newest}`);
          '

      - uses: actions/configure-pages@v5

      # Keep the checked-in index in step with what npm serves instead of
      # leaving every release to a manual "build and commit" step. `[skip ci]`
      # keeps the index commit from starting another test matrix.
      - name: Commit the rebuilt index
        run: |
          set -euo pipefail
          if git diff --quiet -- market/index.json; then
            echo "index already current"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/index.json
          git commit -m "market: rebuild index for $version [skip ci]"
          git push origin HEAD:main

      # Re-running this job re-uploads a Pages artifact. deploy-pages rejects a
      # run with more than one artifact named "github-pages", and
      # upload-pages-artifact has no rename input, so delete older attempts'
      # artifact first. Failures here are non-fatal for the first attempt.
      - name: Drop stale Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name !== 'github-pages') continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - uses: actions/upload-pages-artifact@v4
        with:
          path: market

      # deploy-pages immediately after upload occasionally reports "No artifacts
      # named github-pages" while the artifact is still propagating.
      - name: Wait for the Pages artifact to be visible
        run: sleep 5

      - id: deployment
        uses: actions/deploy-pages@v4
