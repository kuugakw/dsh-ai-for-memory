name: market

# Publishes the plugin index that DSH's experimental "Custom plugin indexes"
# feature can be pointed at (index.json + icons/ under market/).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait until npm serves this version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # The registry CDN can lag several minutes behind a successful publish.
          # Query the version endpoint directly (no npm cache) and allow 10 min.
          url="https://registry.npmjs.org/dsh-ai-for-memory/$version"
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "npm serves $version"
              exit 0
            fi
            sleep 10
          done
          echo "npm never served dsh-ai-for-memory@$version (last HTTP $code)" >&2
          exit 1

      - name: Build index
        run: node scripts/market/build-index.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: market

      - id: deployment
        uses: actions/deploy-pages@v4
